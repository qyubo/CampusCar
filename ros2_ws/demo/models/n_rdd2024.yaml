# N-RDD2024路面缺陷数据集配置
# 用于YOLOv8训练

path: datasets/n_rdd2024  # 数据集根目录
train: images/train  # 训练集
val: images/val      # 验证集

# 类别定义（RDD2020标准）
nc: 10  # 类别数量
names: ['D00', 'D10', 'D20', 'D30', 'D40', 'D50', 'D60', 'D70', 'D80', 'D90']

# 类别说明
# D00: 横向裂缝
# D10: 纵向裂缝  
# D20: 龟裂
# D30: 边缘裂缝
# D40: 坑槽
# D50: 修补区域
# D60: 井盖破损
# D70: 路面标线损坏
# D80: 排水设施损坏
# D90: 其他损坏
