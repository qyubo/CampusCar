ground_segmentation:
  ros__parameters:
    num_sectors: 64
    num_rings: 20
    max_range: 30.0
    min_range: 1.0
    sensor_height: 0.5
    ground_threshold: 0.15
    normal_angle_threshold: 10.0
    initial_seed_points: 200

lidar_obstacle_detector:
  ros__parameters:
    grid_resolution: 0.05
    elevation_threshold_minor: 0.002
    elevation_threshold_major: 0.005
    cluster_tolerance: 0.15
    min_cluster_size: 10
    max_cluster_size: 5000
    dem_map_path: ""
    defect_id_prefix: "lidar"
